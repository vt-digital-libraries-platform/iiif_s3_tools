# Example configuration for x3d-batch-rotate.
# Copy this file (e.g. `cp config_example.yaml config.yaml`) and adjust
# the values below, then run with: x3d-batch-rotate -config config.yaml

# Directory containing the .x3d files to process (only files directly in
# this directory are considered, not subdirectories). If identifiers_file
# (below) is set, models are downloaded into this directory before it's
# scanned, so it does not need to pre-exist or already contain anything.
# Used only as working/scratch space -- see output_dir below for where the
# actual result (the thumbnail) ends up.
input_dir: /path/to/models

# Directory each model's thumbnail PNG is written to. This is the ONLY
# thing the tool writes to output_dir: no rotated .x3d file and no
# unrotated ("initial") render are ever written anywhere -- the rotation
# is applied to the model in memory purely to produce the thumbnail.
# Defaults to input_dir if omitted.
output_dir: /path/to/thumbnails

# --- Fetch phase (optional) ---
# When identifiers_file is set, the tool first reads a JSON array of
# identifier strings from it (e.g. ["368a8114", "abcd1234"]), looks each
# one up in DynamoDB via the AWS SDK for Go v2 (GetItem/Scan, using the
# SDK's default credential chain -- environment variables, shared
# config/credentials file, SSO, instance/task role, etc.; there is no
# credential configuration here), reads its "archiveOptions" attribute
# (an AppSync AWSJSON-typed field -- stored in DynamoDB either as a
# native Map of nested attributes or as a String holding JSON text; both
# are accepted), and downloads the model at
# archiveOptions.assets.x3d_config plus its texture (found by parsing
# the downloaded model's own
# <ImageTexture url="..."> reference, so the texture filename never needs
# to be guessed or hardcoded) into input_dir. Each identifier's own value
# (not the model's filename) is used to name its thumbnail:
# <identifier>_thumbnail.png. A failure for one identifier is logged and
# does not stop the others -- the render phase below then simply runs
# over whatever models were actually fetched.
#
# Leave unset (the default) to skip this phase entirely and just process
# .x3d files already sitting in input_dir; in that case each file's own
# basename (without extension) is used as its "identifier" for naming.
identifiers_file: ""

# AWS region and DynamoDB table the fetch phase looks identifiers up in.
# Required only when identifiers_file is set.
region: us-east-1
table_name: < your table name >

# How to look an identifier up:
#   get_item -- identifier IS the table's partition key value; a single
#               DynamoDB GetItem call. Fast, and the default.
#   scan     -- identifier is the value of some other attribute
#               (identifier_attr, below); a DynamoDB Scan with a filter
#               expression, paginating through the whole table if needed.
#               Works regardless of key schema, but reads the whole table
#               on every lookup -- fine for a handful of identifiers,
#               slow for large batches/tables.
lookup_mode: get_item

# DynamoDB attribute name used as the GetItem key, when lookup_mode is
# get_item.
partition_key_attr: id

# DynamoDB attribute name to filter on, when lookup_mode is scan.
identifier_attr: identifier

# Prepended to every identifier from identifiers_file before it's used to
# look the item up (via either mode). Useful when identifiers are bare
# suffixes of a longer key value, e.g. identifier_attr: custom_key with
# identifier_prefix: "ark:/53696/" to turn "368a8114" into the actual
# stored value "ark:/53696/368a8114". Leave empty (the default) to match
# identifiers exactly as given.
identifier_prefix: ""

# DynamoDB attribute holding the model's JSON config as a string. The
# download URL is read from this JSON at assets.x3d_config.
archive_options_field: archiveOptions

# Rotation applied to a copy of each model, in memory, before rendering
# its thumbnail. Positive/negative sign controls direction; axis is an
# X3D SFVec3f string. "1 0 0" with a negative angle reproduces "drag up"
# in an examine-mode X3D viewer (tips the top/dorsal side of the model
# toward the camera).
degrees: -75
axis: "1 0 0"

# Whether to render thumbnails at all. If false, the tool only runs the
# fetch phase (if identifiers_file is set) and does nothing else -- no
# rotation, no rendering, no output files.
render: true

# Width and height, in pixels, of the square thumbnail PNG. If the
# rendered canvas isn't already exactly this size and square (it always
# should be, but this is a safety net against e.g. unexpected browser
# DPI scaling), it's first centered on a white square background sized to
# its longer side -- no cropping, no stretching -- and that square is then
# scaled to this size. The source pixels themselves are never otherwise
# altered.
thumbnail_size: 250

# Extra seconds to wait after the model's geometry is confirmed loaded,
# to give its texture image time to finish decoding and draw.
render_wait_seconds: 4

# Max seconds to wait for a model to load before giving up on it.
render_timeout_seconds: 60

# X3DOM runtime used for rendering. Defaults to the same build the
# production DLP viewer uses.
x3dom_js_url: "https://img.cloud.lib.vt.edu/scripts/x3dom_1.8.4-dev.js"
x3dom_css_url: "https://img.cloud.lib.vt.edu/scripts/x3dom.css"

# Filename suffix for the thumbnail PNG, appended to each model's
# identifier (e.g. "368a8114" + thumbnail_suffix -> "368a8114_thumbnail.png").
thumbnail_suffix: "_thumbnail.png"

# When true, log what would happen (which models would be rotated and
# rendered, and to what output path) without writing or rendering
# anything. Can also be forced on with the -dry-run CLI flag regardless
# of what is set here.
dry_run: false
